[package]
name = "tracewasm-core"
version = "0.1.0"
edition = "2024"

[dependencies]
wasmparser = { version = "0.253.0" }
thiserror = { workspace = true }
rustc-hash = { workspace = true }
bytemuck = "1.25.2"
tracewasm-macros = { path = "../tracewasm-macros" }
smallvec = { workspace = true }
rustc-demangle = { workspace = true }
addr2line = { workspace = true }
gimli = { workspace = true }
phf = { version = "0.14.0", features = ["macros"] }
id-arena = { workspace = true }
anyhow = { workspace = true }
ordered-float = { workspace = true }
tracewasm-llvm = { path = "../tracewasm-llvm" }
tracewasm-utils = { path = "../tracewasm-utils" }

# Only for the JIT lowering harness, which needs `LLVMCodeGenOptLevel` to start a JIT.
llvm-sys = { version = "221.0.0", optional = true }

[dev-dependencies]
wat = "1.254.0"

[features]
# Runs lowered code in-process under the JIT. Links libLLVM, so it stays opt-in:
# `cargo test -p tracewasm-core --features jit --lib jit_harness`.
jit = ["tracewasm-llvm/jit", "dep:llvm-sys"]
