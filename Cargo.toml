[workspace]
members = ["bin/playground", "trace-rs","tracewasm-core", "tracewasm-macros", "tracewasm-test"]

resolver = "3"

[workspace.dependencies]
anyhow = "1.0.103"
thiserror = "2.0.19"
rustc-hash = "2.1.3"
smallvec = "1.15.2"
rustc-demangle = "0.1.28"
gimli = "0.34.0"
serde = { version = "1.0.229", features = ["derive"] }
addr2line = "0.27.0"
