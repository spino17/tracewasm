[package]
name = "tracewasm-test"
version = "0.1.0"
edition = "2024"
publish = false

# A test harness crate. The library half holds the shared plumbing (import
# registry, call helpers, guest loading, metric collection); everything under
# `tests/` consumes it.
#
# `build.rs` compiles each program in `guests/` to `wasm32-unknown-unknown`. The
# same sources are also `include!`d natively by the differential tests, so every
# guest has a ground truth that cannot drift from the wasm under test.
[dependencies]
tracewasm-core = { path = "../tracewasm-core" }
tracewasm-macros = { path = "../tracewasm-macros" }

# Lets a test assemble a fixture from `wat` source inline, for instructions rustc
# never emits and so no guest can reach. The `fixtures/*.wasm` blobs predate this
# and have no checked-in source; new fixtures should be written as `wat`.
[dev-dependencies]
wat = "1.254.0"
