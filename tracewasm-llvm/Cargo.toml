[package]
name = "tracewasm-llvm"
version = "0.1.0"
edition = "2024"

[dependencies]
id-arena = { workspace = true }
anyhow = { workspace = true }
thiserror =  { workspace = true }
rustc-hash = { workspace = true }
tracewasm-utils = { path = "../tracewasm-utils" }
ordered-float = { workspace = true }
regex = "1.13.1"

# The JIT links libLLVM (through `llvm-sys`, which needs a matching LLVM install).
# Everything else in this crate is pure Rust, so it stays opt-in.
llvm-sys = { version = "221.0.0", optional = true }
inventory = { version = "0.3", optional = true }
tracewasm-llvm-macros = { path = "../tracewasm-llvm-macros", optional = true }

[features]
jit = ["dep:llvm-sys", "dep:inventory", "dep:tracewasm-llvm-macros"]

[[example]]
name = "jit"
required-features = ["jit"]

[[test]]
name = "jit_host_funcs"
required-features = ["jit"]

[[test]]
name = "jit_imported"
required-features = ["jit"]

[[test]]
name = "jit_instance"
required-features = ["jit"]

[[test]]
name = "jit_wrapper"
required-features = ["jit"]
